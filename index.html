<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Are You Officially Old?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500;700&family=IBM+Plex+Mono:wght@400;600&family=Stardos+Stencil:wght@700&display=swap">
<style>
/* Layout: a single-column field-inspection form. Stencil header, typed-form body, result card that swaps between a drill-sergeant poster and a short brush-off. */
:root {
  --paper: #ece6d2;
  --card: #f6f1e0;
  --ink: #23271c;
  --muted: #5d6148;
  --olive: #4a5230;
  --red: #b3261e;
  --mustard: #d9a21b;
  --line: #b9b28f;
  --poster-bg: #b3261e;
  --poster-ray: #c8382d;
  --poster-cream: #f3e8c4;
  --poster-ink: #23271c;
  --poster-coat: #4a5230;
  --poster-skin: #d9a679;
  --poster-brim: #6b5a30;
  --font-display: "Stardos Stencil", "Impact", "Arial Black", sans-serif;
  --font-body: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-mono: "IBM Plex Mono", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1e14; --card: #252a1a; --ink: #ece6d2; --muted: #a7a98a;
    --olive: #8c9a5b; --red: #e0554a; --mustard: #e6b53a; --line: #4a5030;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1e14; --card: #252a1a; --ink: #ece6d2; --muted: #a7a98a;
  --olive: #8c9a5b; --red: #e0554a; --mustard: #e6b53a; --line: #4a5030;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.4;
  padding-block: 1.5rem 2.5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
.mast { display: flex; flex-direction: column; gap: 0.35rem; border-bottom: 4px solid var(--ink); padding-bottom: 0.9rem; }
.form-no { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-size: clamp(2rem, 9vw, 3rem); line-height: 1; margin: 0; text-transform: uppercase; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 34ch; }
form { display: flex; flex-wrap: wrap; align-items: end; gap: 0.75rem; }
.field { display: flex; flex-direction: column; gap: 0.3rem; flex: 1 1 12rem; min-width: 0; }
label { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }
input[type="date"] {
  font: 600 1.1rem var(--font-mono);
  color: var(--ink);
  background: var(--card);
  border: 2px solid var(--ink);
  border-radius: 0;
  padding: 0.6rem 0.7rem;
  min-width: 0;
  width: 100%;
}
button {
  font: 700 1.25rem var(--font-display);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #f6f1e0;
  background: var(--red);
  border: 2px solid var(--ink);
  border-radius: 0;
  padding: 0.6rem 1.4rem;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
}
button:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
.err { font-family: var(--font-mono); font-size: 0.85rem; color: var(--red); margin: 0; min-height: 1.2em; }

.timeline { background: var(--card); border: 2px solid var(--ink); padding: 0.6rem 0.8rem 0.7rem; display: flex; flex-direction: column; gap: 0.3rem; }
.tl-head { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.track-area { position: relative; height: 4.6rem; margin-inline: 0.5rem; }
.track { position: absolute; left: 0; right: 0; top: 1.7rem; height: 8px; background: var(--line); }
.zone-war { position: absolute; top: 1.7rem; height: 8px; background: var(--olive); }
.zone-now { position: absolute; top: 1.7rem; height: 8px; background: var(--mustard); }
.tick { position: absolute; width: 2px; background: var(--ink); top: 1.4rem; height: 1.3rem; }
.tl-label { position: absolute; top: 2.85rem; transform: translateX(-50%); font-family: var(--font-mono); font-size: 0.64rem; line-height: 1.25; text-align: center; white-space: pre; }
.tl-label.right { transform: translateX(-100%); text-align: right; }
.tl-label.left { transform: none; text-align: left; }
.you { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; font-family: var(--font-display); font-size: 0.85rem; line-height: 1; color: var(--red); }
.you::after { content: ""; width: 2px; height: 1.1rem; background: var(--red); }
.you[hidden] { display: none !important; }
.tl-note { margin: 0; font-size: 0.9rem; line-height: 1.3; }

.result { display: flex; flex-direction: column; gap: 1rem; }
.verdict { background: var(--card); border: 2px solid var(--ink); padding: 1.1rem 1.1rem 1.25rem; display: flex; flex-direction: column; gap: 0.7rem; }
.stamp { align-self: flex-start; font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--red); border: 3px solid var(--red); padding: 0.1rem 0.6rem; transform: rotate(-2.5deg); }
.stamp.young { color: var(--olive); border-color: var(--olive); }
.verdict h2 { font-family: var(--font-display); font-size: clamp(1.6rem, 7vw, 2.2rem); line-height: 1.05; margin: 0; text-transform: uppercase; text-wrap: balance; }
.verdict p { margin: 0; }
.math { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 0.7rem; display: grid; gap: 0.2rem; }
.math b { color: var(--ink); font-weight: 600; }
.poster { width: 100%; max-width: 22rem; height: auto; border: 2px solid var(--ink); align-self: center; background: var(--poster-bg); }
.poster-wrap { display: flex; flex-direction: column; gap: 0.4rem; }
.poster-wrap figcaption { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); text-align: center; }
figure { margin: 0; }
.again { align-self: flex-start; }
.byline { margin: 0; font-weight: 300; font-size: 0.9rem; letter-spacing: 0.1em; color: var(--muted); }
.form-no a, .byline a, .sponsor a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.form-no a:hover, .byline a:hover, .sponsor a:hover { color: var(--red); text-decoration-color: var(--red); }
.form-no a:focus-visible, .byline a:focus-visible, .sponsor a:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
.sponsor { align-self: flex-end; text-align: right; margin: 0.5rem 0 0; font-weight: 500; font-size: 1rem; letter-spacing: 0.06em; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .verdict { animation: slam 0.25s ease-out; }
  @keyframes slam { from { transform: scale(1.04); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
}
</style>

<main class="wrap">
  <header class="mast">
    <div class="form-no">Age inspection by <a href="https://collegetowns.org" target="_blank" rel="noopener">College Towns</a></div>
    <h1>Are You Officially Old?</h1>
    <p class="lede">Enter your date of birth. We measure whether you were born closer to the end of World War II or to today.</p>
  </header>

  <form id="f" novalidate>
    <div class="field">
      <label for="dob">Date of birth</label>
      <input id="dob" type="date" min="1880-01-01" required>
    </div>
    <button type="submit">Report in</button>
  </form>
  <p class="err" id="err" role="alert"></p>

  <section class="timeline" aria-label="Timeline from the end of World War II to today">
    <div class="tl-head">Distance chart · World War II to Today</div>
    <div class="track-area" id="tl">
      <div class="track"></div>
      <div class="zone-war" id="zw"></div>
      <div class="zone-now" id="zn"></div>
      <div class="tick" id="t-war"></div>
      <div class="tick" id="t-mid"></div>
      <div class="tick" id="t-now" style="width:3px"></div>
      <div class="tl-label left" id="l-war"></div>
      <div class="tl-label" id="l-mid"></div>
      <div class="tl-label right" id="l-now"></div>
      <div class="you" id="you" hidden><span>YOU</span></div>
    </div>
    <p class="tl-note" id="tl-note"></p>
  </section>

  <section class="result" id="result" aria-live="polite"></section>

  <p class="sponsor">Part of the 1941 Project on <a href="https://collegetowns.org/" target="_blank" rel="noopener">CollegeTowns.org</a></p>
</main>

<script>
(function () {
  var WAR_END = Date.UTC(1945, 8, 2); // formal Japanese surrender, 2 September 1945
  var DAY = 86400000;
  var START = WAR_END; // the bar begins at the end of WWII

  var QUIPS = [
    "On your feet, you old maggot! The war was practically in your lifetime!",
    "Drop and give me twenty, grandpa! Then give me twenty more for the hip!",
    "You call that a birth year, you wrinkled old maggot? Stand up straight!",
    "Pick up that cane and march, you antique! I've seen fossils with better posture!",
    "Did you ration sugar, you old maggot? Because you look like you invented it!"
  ];

  function todayUTC() {
    var d = new Date();
    return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function judge(birthMs, nowMs) {
    var toWar = Math.abs(birthMs - WAR_END);
    var toNow = nowMs - birthMs;
    return {
      closerToWar: toWar < toNow,
      daysToWar: toWar / DAY,
      daysToNow: toNow / DAY,
      beforeWar: birthMs < WAR_END
    };
  }

  function fmtDate(ms) {
    return new Date(ms).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
  }
  function yrs(days) { return (days / 365.25).toFixed(1); }

  var now = todayUTC();
  var mid = Math.round((WAR_END + now) / 2);
  var range = now - START;
  function pct(ms) { return ((ms - START) / range * 100); }

  function place(id, ms) { document.getElementById(id).style.left = pct(ms) + "%"; }
  place("t-war", WAR_END); place("t-mid", mid); place("t-now", now);
  place("l-war", WAR_END); place("l-mid", mid);
  document.getElementById("l-now").style.left = "100%";
  var zw = document.getElementById("zw"), zn = document.getElementById("zn");
  zw.style.left = "0%"; zw.style.width = pct(mid) + "%";
  zn.style.left = pct(mid) + "%"; zn.style.width = (100 - pct(mid)) + "%";
  document.getElementById("l-war").textContent = "End of WWII\n(1945)";
  document.getElementById("l-mid").textContent = "Halfway " + new Date(mid).getUTCFullYear();
  document.getElementById("l-now").textContent = "Today";
  document.getElementById("tl-note").textContent =
    "Born before " + fmtDate(mid) + "? You are closer to the war. Born after? You are closer to today.";

  var INK = "#23271c", CREAM = "#f3e8c4", SKIN = "#d9a679", BRIM = "#6b5a30", RED = "#b3261e", GOLD = "#e0a91f", NAVY = "#1f3a5f", WOOD = "#7a4a24";
  var PAL = {
    red:     { bg: "#b3261e", ray: "#c8382d", coat: "#4a5230" },
    navy:    { bg: "#1f3a5f", ray: "#2b4c7a", coat: "#6b7440" },
    mustard: { bg: "#d9a21b", ray: "#e8b83a", coat: "#4a5230" },
    olive:   { bg: "#4a5230", ray: "#5b6639", coat: "#2a2e20" },
    char:    { bg: "#2b2f24", ray: "#3a3f30", coat: "#4a5230" }
  };

  function star(cx, cy, r) {
    var pts = [];
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rad = i % 2 ? r * 0.4 : r;
      pts.push((cx + rad * Math.cos(ang)).toFixed(1) + "," + (cy + rad * Math.sin(ang)).toFixed(1));
    }
    return '<polygon points="' + pts.join(" ") + '"/>';
  }

  var BD = {
    rays: function (p) {
      var s = "";
      for (var i = 0; i < 16; i++) {
        s += '<path d="M150 190 L-60 -10 L-10 -80 Z" fill="' + p.ray + '" transform="rotate(' + (i * 22.5) + ' 150 190)"/>';
      }
      return s;
    },
    stripes: function (p) {
      var s = "";
      for (var i = -4; i < 10; i++) {
        s += '<path d="M' + (i * 50) + ' 0 L' + (i * 50 + 25) + ' 0 L' + (i * 50 - 125) + ' 400 L' + (i * 50 - 150) + ' 400 Z" fill="' + p.ray + '"/>';
      }
      return s;
    },
    stars: function (p) {
      var pos = [[40, 112], [260, 118], [62, 240], [246, 236], [150, 84], [30, 320], [272, 320]];
      var s = '<g fill="' + p.ray + '">';
      pos.forEach(function (q) { s += star(q[0], q[1], 17); });
      return s + "</g>";
    },
    search: function () {
      return '<path d="M20 400 L112 0 L196 0 Z" fill="' + CREAM + '" opacity="0.16"/>' +
             '<path d="M290 400 L104 0 L188 0 Z" fill="' + CREAM + '" opacity="0.12"/>';
    },
    dots: function (p) {
      return '<defs><pattern id="hd" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="3.4" fill="' + p.ray + '"/></pattern></defs>' +
             '<rect width="300" height="400" fill="url(#hd)"/>';
    },
    checker: function (p) {
      return '<defs><pattern id="ck" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="' + p.ray + '"/><rect x="30" y="30" width="30" height="30" fill="' + p.ray + '"/></pattern></defs>' +
             '<rect width="300" height="400" fill="url(#ck)"/>';
    },
    bunting: function (p) {
      var s = '<path d="M0 74 Q150 100 300 74" stroke="' + INK + '" stroke-width="3" fill="none"/>';
      for (var i = 0; i < 8; i++) {
        var x = i * 38 + 2;
        var y = 74 + Math.sin((x + 19) / 300 * Math.PI) * 17;
        s += '<path d="M' + x + ' ' + (y - 1).toFixed(1) + ' L' + (x + 34) + ' ' + (y - 1).toFixed(1) + ' L' + (x + 17) + ' ' + (y + 34).toFixed(1) + ' Z" fill="' + (i % 2 ? p.ray : CREAM) + '" stroke="' + INK + '" stroke-width="2"/>';
      }
      return s;
    },
    horizon: function (p) {
      return '<circle cx="150" cy="300" r="130" fill="' + p.ray + '"/>' +
             '<rect y="300" width="300" height="100" fill="#000" opacity="0.22"/>' +
             '<path d="M0 300 H300 M0 316 H300 M0 336 H300" stroke="' + INK + '" stroke-width="2" opacity="0.5"/>';
    }
  };

  function base(coat) {
    return '<path d="M30 400 L52 305 Q150 262 248 305 L270 400 Z" fill="' + coat + '"/>' +
           '<path d="M120 300 L150 340 L180 300 L172 262 L128 262 Z" fill="' + SKIN + '"/>' +
           '<path d="M130 318 L150 400 L170 318 L150 336 Z" fill="' + CREAM + '" opacity="0.9"/>';
  }

  var MOUTH = {
    shout: '<path d="M128 246 Q150 232 172 246 Q150 276 128 246 Z" fill="' + INK + '"/><rect x="138" y="244" width="24" height="5" fill="' + CREAM + '"/>',
    flat: '<path d="M130 250 L170 250" stroke="' + INK + '" stroke-width="6" stroke-linecap="round"/>',
    grit: '<rect x="128" y="242" width="44" height="14" rx="4" fill="' + CREAM + '" stroke="' + INK + '" stroke-width="3"/><path d="M139 242 V256 M150 242 V256 M161 242 V256" stroke="' + INK + '" stroke-width="2"/>'
  };

  function head(mouth) {
    return '<ellipse cx="150" cy="205" rx="44" ry="54" fill="' + SKIN + '"/>' +
      '<path d="M108 168 Q150 152 192 168" stroke="' + INK + '" stroke-width="7" fill="none" stroke-linecap="round"/>' +
      '<path d="M122 200 L140 207" stroke="' + INK + '" stroke-width="6" stroke-linecap="round"/>' +
      '<path d="M178 200 L160 207" stroke="' + INK + '" stroke-width="6" stroke-linecap="round"/>' +
      '<circle cx="131" cy="212" r="4" fill="' + INK + '"/><circle cx="169" cy="212" r="4" fill="' + INK + '"/>' +
      MOUTH[mouth] +
      '<ellipse cx="150" cy="158" rx="82" ry="14" fill="' + BRIM + '"/>' +
      '<path d="M104 156 Q106 108 150 98 Q194 108 196 156 Q150 168 104 156 Z" fill="' + BRIM + '"/>' +
      '<path d="M104 150 Q150 164 196 150 L196 158 Q150 172 104 158 Z" fill="' + INK + '" opacity="0.55"/>';
  }

  var PROPS = {
    point: function (c) {
      return '<path d="M232 330 L246 262 L270 268 L262 336 Z" fill="' + c + '" stroke="' + INK + '" stroke-width="2"/>' +
             '<path d="M252 262 L206 222 Q198 214 206 208 Q214 204 220 210 L268 252 Z" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="2"/>';
    },
    megaphone: function () {
      return '<path d="M134 240 L58 210 L48 286 L134 258 Z" fill="' + GOLD + '" stroke="' + INK + '" stroke-width="4"/>' +
             '<rect x="128" y="238" width="14" height="24" rx="4" fill="' + INK + '"/>' +
             '<path d="M30 220 Q20 248 30 276 M16 210 Q2 248 16 290" stroke="' + CREAM + '" stroke-width="4" fill="none" stroke-linecap="round"/>' +
             '<ellipse cx="186" cy="320" rx="16" ry="12" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="2"/>';
    },
    clip: function () {
      return '<g transform="rotate(-7 220 305)">' +
             '<rect x="172" y="268" width="92" height="76" fill="#8a6a3a" stroke="' + INK + '" stroke-width="3"/>' +
             '<rect x="180" y="282" width="76" height="56" fill="' + CREAM + '"/>' +
             '<rect x="200" y="262" width="36" height="14" fill="#b9b28f" stroke="' + INK + '" stroke-width="2"/>' +
             '<path d="M188 296 L193 301 L201 291 M188 312 L193 317 L201 307 M188 328 L193 333 L201 323" stroke="' + RED + '" stroke-width="3" fill="none"/>' +
             '<path d="M208 297 H248 M208 313 H248 M208 329 H248" stroke="' + INK + '" stroke-width="3"/>' +
             '</g>' +
             '<ellipse cx="174" cy="318" rx="12" ry="18" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="2"/>';
    },
    whistle: function () {
      return '<path d="M142 250 Q96 296 124 332" stroke="' + RED + '" stroke-width="4" fill="none"/>' +
             '<rect x="140" y="240" width="34" height="14" rx="6" fill="#c9c3a0" stroke="' + INK + '" stroke-width="3"/>' +
             '<circle cx="180" cy="248" r="11" fill="#c9c3a0" stroke="' + INK + '" stroke-width="3"/>' +
             '<path d="M204 232 L222 222 M206 248 L228 248 M204 264 L222 274" stroke="' + CREAM + '" stroke-width="4" stroke-linecap="round"/>';
    },
    salute: function (c) {
      return '<path d="M236 336 L270 322 L228 214 L204 224 Z" fill="' + c + '" stroke="' + INK + '" stroke-width="3"/>' +
             '<path d="M196 178 L234 170 L242 196 L206 210 Z" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3"/>';
    },
    magnifier: function () {
      return '<path d="M196 232 L252 306" stroke="#3b3320" stroke-width="12" stroke-linecap="round"/>' +
             '<circle cx="172" cy="206" r="34" fill="' + CREAM + '" fill-opacity="0.35" stroke="#3b3320" stroke-width="8"/>' +
             '<ellipse cx="172" cy="208" rx="16" ry="12" fill="#fff"/><circle cx="172" cy="208" r="7" fill="' + INK + '"/>' +
             '<circle cx="248" cy="302" r="15" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="2"/>';
    },
    stopwatch: function () {
      return '<circle cx="224" cy="304" r="32" fill="' + CREAM + '" stroke="' + INK + '" stroke-width="5"/>' +
             '<rect x="216" y="262" width="16" height="8" fill="' + INK + '"/>' +
             '<path d="M224 304 L224 282" stroke="' + RED + '" stroke-width="4" stroke-linecap="round"/>' +
             '<path d="M224 304 L240 314" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>' +
             '<path d="M224 276 V280 M224 328 V332 M196 304 H200 M248 304 H252" stroke="' + INK + '" stroke-width="3"/>' +
             '<circle cx="224" cy="304" r="4" fill="' + INK + '"/>' +
             '<ellipse cx="188" cy="322" rx="14" ry="11" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="2"/>';
    },
    arms: function () {
      return '<g stroke="' + INK + '" stroke-width="3">' +
             '<path d="M58 300 L240 318 L236 338 L54 320 Z" fill="#5e6840"/>' +
             '<path d="M242 300 L60 318 L64 338 L246 320 Z" fill="#6f7a4c"/></g>' +
             '<circle cx="240" cy="328" r="14" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="2"/>' +
             '<circle cx="60" cy="328" r="14" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="2"/>';
    }
  };

  function serg(fig, mouth) {
    return function (p) { return base(p.coat) + head(mouth) + PROPS[fig](p.coat); };
  }

  function cane() {
    return '<path d="M70 306 L215 122 Q232 98 214 84 Q196 74 186 96" stroke="#6b4a24" stroke-width="12" fill="none" stroke-linecap="round"/>';
  }
  var OBJ = {
    canes: function () {
      return cane() + '<g transform="translate(300 0) scale(-1 1)">' + cane() + '</g>' +
             '<g fill="' + GOLD + '" stroke="' + INK + '" stroke-width="3">' + star(150, 214, 36) + '</g>';
    },

  function render(birthMs) {
    var r = judge(birthMs, now);
    var when = r.beforeWar ? yrs(r.daysToWar) + " years before V-J Day" : yrs(r.daysToWar) + " years after V-J Day";
    var math =

    var html;
